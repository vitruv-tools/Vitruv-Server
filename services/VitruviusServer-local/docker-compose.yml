services:
  vitruvius-server-postgres:
    image: postgres:17.7-alpine
    container_name: vitruvius-server-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=vitruvius-server
    volumes:
      - ./data/vitruvius-server-postgres-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
